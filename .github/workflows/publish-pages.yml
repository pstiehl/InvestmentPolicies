name: Publish dashboard

# Auto-publish disabled until hosting target is chosen.
# Free-plan GitHub repos cannot serve Pages from a *private* repo, so this
# workflow waits for either:
#   (a) Upgrade to GitHub Team plan and switch back to deploy-pages, or
#   (b) Pivot to Cloudflare Pages / Vercel / sandpaw.ai subdomain + Access
# Re-enable the `push` trigger once one of those is wired up.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python site/build_site.py
      - name: Upload site artifact (sanity build only — not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: alm-policies-site
          path: site/dist
          retention-days: 7
